<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тридевятое царство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#e3b341;--gold2:#9c7420;--red:#7d0f1f;--ink:#1a0d08;--paper:#fbf1dc}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0c0710;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:"PT Serif",Georgia,serif;color:var(--paper)}
#stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:min(100vw,calc(100vh*.8));overflow:hidden;background:#000;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#stage.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(-50%)}20%{transform:translate(calc(-50% - 7px),3px)}40%{transform:translate(calc(-50% + 6px),-4px)}60%{transform:translate(calc(-50% - 4px),2px)}80%{transform:translate(calc(-50% + 3px),-1px)}}
.bg{position:absolute;inset:0;opacity:0;transition:opacity .8s}
.bg.on{opacity:1}
.bg svg{width:100%;height:100%;display:block}
#chars{position:absolute;inset:0;pointer-events:none}
.ch{position:absolute;bottom:20%;transform:translateX(-50%);opacity:0;transition:opacity .45s,left .5s,filter .3s}
.ch.on{opacity:1}
.ch.dim{filter:brightness(.55) saturate(.7)}
.ch svg{width:100%;height:100%;display:block;overflow:visible}
.ch .bob{animation:bob 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-1.2%) scaleY(1.008)}}
svg .swirl{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
svg .flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.06,.9)}}
svg .glow{transform-box:fill-box;transform-origin:center;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08);opacity:.75}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .7s}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}

#box{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0));min-height:26%;
  background:linear-gradient(#2a0c10f0,#170609f5);border:2px solid var(--gold);border-radius:14px;
  box-shadow:0 0 0 4px #170609cc,0 0 0 5px var(--gold2),0 8px 30px #000a;padding:22px 18px 16px;cursor:pointer}
#box::before,#box::after{content:"❖";position:absolute;color:var(--gold);font-size:14px;top:4px}
#box::before{left:8px}#box::after{right:8px}
#name{position:absolute;top:-17px;left:18px;background:linear-gradient(#b5122e,#7d0f1f);border:2px solid var(--gold);border-radius:8px;
  padding:3px 14px;font-weight:700;font-size:clamp(14px,3.8vw,17px);color:#fff4d6;letter-spacing:.3px;box-shadow:0 2px 8px #0008}
#name.hid{display:none}
#text{font-size:clamp(16px,4.4vw,20px);line-height:1.45;min-height:3em;white-space:pre-wrap}
#text.nar{font-style:italic;color:#f3e2bd}
#more{position:absolute;right:16px;bottom:8px;color:var(--gold);font-size:14px;opacity:0;animation:blink 1s infinite}
#more.on{opacity:1}
@keyframes blink{50%{transform:translateY(3px)}}
#box.hidden{display:none}

#choices{position:absolute;left:0;right:0;top:12%;bottom:calc(26% + 34px);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:12px;padding:0 18px;pointer-events:none}
#choices button{pointer-events:auto}
.btn{font:inherit;font-size:clamp(15px,4.2vw,18px);color:#fff4d6;background:linear-gradient(#8e1b2a,#5a0a16);border:2px solid var(--gold);border-radius:12px;
  padding:12px 16px;width:100%;max-width:440px;cursor:pointer;box-shadow:0 0 0 3px #170609cc,0 6px 16px #0009;line-height:1.3;text-align:center;
  animation:pop .35s both}
.btn:hover,.btn:focus-visible{background:linear-gradient(#b5122e,#7d0f1f);outline:none}
.btn:active{transform:scale(.98)}
.btn.sec{background:linear-gradient(#2c4a8a,#172a55)}
.btn.ghost{background:#0000;box-shadow:none;border-color:#e3b34188}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}

#top{position:absolute;top:calc(10px + env(safe-area-inset-top,0));right:10px;display:flex;gap:8px;z-index:5}
#top button{font:inherit;font-size:14px;color:#fff4d6;background:#170609b0;border:1px solid #e3b34199;border-radius:10px;padding:6px 11px;cursor:pointer}

.ov{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;gap:12px;
  background:radial-gradient(ellipse at 50% 40%,#2a0c10e8,#0c0507f5);text-align:center}
.ov.hid{display:none}
.ov h1{font-family:"Ruslan Display",serif;font-weight:400;color:var(--gold);font-size:clamp(32px,10vw,52px);line-height:1.05;margin:0 0 4px;text-shadow:0 3px 0 #5a0a16,0 0 24px #e3b34155}
.ov h2{font-family:"Ruslan Display",serif;font-weight:400;color:var(--gold);font-size:clamp(22px,6.5vw,32px);margin:0}
.ov p{margin:0;max-width:440px;line-height:1.45;color:#f3e2bd}
.orn{color:var(--gold);letter-spacing:6px;font-size:14px;opacity:.9}
.small{font-size:13px;opacity:.75}
#title{background:radial-gradient(ellipse at 50% 35%,#2a0c10b0,#0c0507ee)}
.list{width:100%;max-width:440px;overflow:auto;max-height:62vh;text-align:left;display:flex;flex-direction:column;gap:8px}
.end-it{border:1px solid #e3b34166;border-radius:10px;padding:10px 12px;background:#0006}
.end-it b{color:var(--gold);display:block;margin-bottom:2px}
.end-it.lock{opacity:.6}
.log-it{padding:6px 0;border-bottom:1px solid #e3b34122;line-height:1.4}
.log-it b{color:var(--gold)}
.log-it i{color:#f3e2bd}
</style></head><body>
<div id="stage">
  <div id="bgs"></div>
  <div id="chars"></div>
  <div id="flash"></div>
  <div id="choices"></div>
  <div id="box" class="hidden"><div id="name" class="hid"></div><div id="text"></div><div id="more">▼</div></div>
  <div id="top" style="display:none"><button id="bLog">Журнал</button><button id="bMenu">Меню</button></div>

  <div id="title" class="ov">
    <div class="orn">❖ ❖ ❖</div>
    <h1>Тридевятое<br>царство</h1>
    <p>Визуальная новелла по мотивам русских народных сказок</p>
    <div class="orn">❖ ❖ ❖</div>
    <button class="btn" id="tNew">Начать сказку</button>
    <button class="btn sec" id="tCont">Продолжить</button>
    <button class="btn ghost" id="tEnds">Концовки</button>
    <p class="small">Тап по тексту — дальше. Шесть концовок ждут того, кто найдёт.</p>
  </div>
  <div id="ends" class="ov hid"><h2>Концовки</h2><div class="list" id="endList"></div><button class="btn ghost" data-close>Назад</button></div>
  <div id="logv" class="ov hid"><h2>Журнал</h2><div class="list" id="logList"></div><button class="btn ghost" data-close>Назад</button></div>
  <div id="menu" class="ov hid"><h2>Меню</h2>
    <button class="btn" data-close>Продолжить</button>
    <button class="btn sec" id="mRe">Переиграть главу</button>
    <button class="btn ghost" id="mTitle">В главное меню</button></div>
  <div id="endv" class="ov hid">
    <div class="orn">❖ Конец ❖</div>
    <h2 id="eTitle"></h2><p id="eDesc"></p><p class="small" id="eCount"></p>
    <button class="btn" id="eRe">Переиграть главу</button>
    <button class="btn ghost" id="eTitleBtn">В главное меню</button>
  </div>
</div>
<script>
'use strict';
/* ============ Telegram ============ */
const tg=window.Telegram&&Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor('#0c0710');tg.setBackgroundColor&&tg.setBackgroundColor('#0c0710')}catch(e){}}
function hap(v){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(v||'light')}catch(e){}}

/* ============ Рисунки: фоны (360×640) ============ */
let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function fir(x,y,h,c){let w=h*.5,d='';for(let k=0;k<3;k++){const t=y-h+k*h*.25,b=t+h*.45,ww=w*(.5+k*.28);d+=`M${x} ${t}L${x+ww/2} ${b}L${x-ww/2} ${b}Z`}
  return `<rect x="${x-h*.03}" y="${y-h*.12}" width="${h*.06}" height="${h*.12}" fill="#1e140c"/><path d="${d}" fill="${c}"/>`}
function firs(n,y0,y1,h0,h1,c,s){seed=s;let o='';for(let i=0;i<n;i++){const x=rnd()*400-20,y=y0+rnd()*(y1-y0);o+=fir(x,y,h0+rnd()*(h1-h0),c)}return o}
function stars(n,s){seed=s;let o='';for(let i=0;i<n;i++)o+=`<circle cx="${rnd()*360}" cy="${rnd()*330}" r="${rnd()*1.3+.3}" fill="#fff" opacity="${.4+rnd()*.6}"/>`;return o}
const SV=b=>`<svg viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
function arch(x,w,top,bot,fill,st){return `<path d="M${x} ${bot}V${top+w*.45}Q${x} ${top} ${x+w/2} ${top}Q${x+w} ${top} ${x+w} ${top+w*.45}V${bot}Z" fill="${fill}" stroke="${st||'#e3b341'}" stroke-width="4"/>`}
function palaceBody(sky){
  return `<defs><linearGradient id="pw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a1f2e"/><stop offset="1" stop-color="#4b0a15"/></linearGradient>
  <linearGradient id="psky" x1="0" y1="0" x2="0" y2="1">${sky}</linearGradient>
  <pattern id="pp" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M18 3L33 18L18 33L3 18Z" fill="none" stroke="#e3b341" stroke-opacity=".22" stroke-width="1.5"/><circle cx="18" cy="18" r="3" fill="#e3b341" fill-opacity=".28"/></pattern>
  <pattern id="pf" width="40" height="20" patternUnits="userSpaceOnUse"><path d="M0 10L20 0L40 10L20 20Z" fill="#5a1019"/></pattern>
  <radialGradient id="lamp"><stop offset="0" stop-color="#ffd77a" stop-opacity=".7"/><stop offset="1" stop-color="#ffd77a" stop-opacity="0"/></radialGradient></defs>
  <rect width="360" height="640" fill="url(#pw)"/><rect width="360" height="480" fill="url(#pp)"/>
  ${arch(22,72,170,350,'url(#psky)')}${arch(266,72,170,350,'url(#psky)')}
  <path d="M58 170V350M22 260H94M302 170V350M266 260H338" stroke="#e3b341" stroke-width="3"/>
  ${arch(118,124,150,480,'#2a0710')}
  <path d="M150 480V330Q150 290 180 286Q210 290 210 330V480Z" fill="#c99a2e" stroke="#7a5512" stroke-width="3"/>
  <path d="M158 470V340Q158 304 180 300Q202 304 202 340V470Z" fill="#b5122e"/>
  <circle cx="180" cy="296" r="7" fill="#e3b341"/><rect x="146" y="420" width="68" height="16" rx="4" fill="#e3b341"/>
  <path d="M0 0H360V40Q270 90 180 60Q90 90 0 40Z" fill="#3b0710"/><path d="M0 40Q90 90 180 60Q270 90 360 40" fill="none" stroke="#e3b341" stroke-width="3"/>
  ${[60,180,300].map(x=>`<line x1="${x}" y1="50" x2="${x}" y2="110" stroke="#e3b341" stroke-width="2"/><circle cx="${x}" cy="118" r="40" fill="url(#lamp)"/><path d="M${x-10} 110h20l-4 18h-12z" fill="#e3b341"/>`).join('')}
  <rect y="480" width="360" height="160" fill="#3a0a12"/><rect y="480" width="360" height="160" fill="url(#pf)"/>
  <rect y="476" width="360" height="6" fill="#e3b341"/>
  <path d="M110 640L150 482H210L250 640Z" fill="#a3162b"/><path d="M118 640L154 482M242 640L206 482" stroke="#e3b341" stroke-width="2"/>`}
const DAY='<stop offset="0" stop-color="#7fb8e6"/><stop offset="1" stop-color="#e8f4ff"/>';
const NIGHT='<stop offset="0" stop-color="#0d0b22"/><stop offset="1" stop-color="#3a2a5a"/>';
const BG={
palace:()=>SV(palaceBody(DAY)),
storm:()=>SV(palaceBody(NIGHT)+`<rect width="360" height="640" fill="#0a0a1a" opacity=".55"/>
  <g class="swirl" opacity=".85">${[0,1,2,3,4].map(i=>`<ellipse cx="180" cy="260" rx="${150-i*26}" ry="${60-i*9}" fill="none" stroke="#11131c" stroke-width="${14-i*2}" transform="rotate(${i*35} 180 260)"/>`).join('')}</g>
  <path d="M290 0L262 90L282 92L250 190" fill="none" stroke="#dfe8ff" stroke-width="3" opacity=".8"/>`),
feast:()=>SV(palaceBody(DAY)+`<path d="M0 120Q45 160 90 120Q135 160 180 120Q225 160 270 120Q315 160 360 120" fill="none" stroke="#3a8a3a" stroke-width="7"/>
  ${[45,135,225,315].map(x=>`<circle cx="${x}" cy="141" r="7" fill="#e83a3a"/><circle cx="${x+8}" cy="136" r="5" fill="#ffd34d"/>`).join('')}
  <rect x="-10" y="430" width="380" height="24" rx="4" fill="#fbf6ee"/><path d="M-10 448H370" stroke="#c8102e" stroke-width="4" stroke-dasharray="10 6"/>
  <ellipse cx="60" cy="428" rx="22" ry="10" fill="#c98a3a"/><path d="M110 430v-26h16v26z" fill="#c99a2e"/><ellipse cx="250" cy="428" rx="26" ry="12" fill="#e8a23a"/><circle cx="310" cy="420" r="12" fill="#d23a3a"/>`),
cross:()=>SV(`<defs><linearGradient id="cs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9a86a"/><stop offset=".6" stop-color="#f7d8a0"/><stop offset="1" stop-color="#fbeac4"/></linearGradient></defs>
  <rect width="360" height="640" fill="url(#cs)"/><circle cx="270" cy="250" r="34" fill="#fff4cf" opacity=".9"/>
  <path d="M0 330Q90 290 180 320Q270 290 360 320V640H0Z" fill="#8a9a5a"/>${firs(18,320,345,40,70,'#4a5e34',3)}
  <path d="M0 380Q120 340 360 375V640H0Z" fill="#a8b46a"/>
  <path d="M150 640Q170 470 176 380L184 380Q190 470 210 640Z" fill="#d9c08a"/>
  <path d="M120 640Q120 500 -10 420V445Q100 510 90 640Z" fill="#d9c08a"/><path d="M240 640Q240 500 370 420V445Q260 510 270 640Z" fill="#d9c08a"/>
  <path d="M138 470Q132 400 160 380Q205 372 222 395Q236 430 228 470Z" fill="#8f8a80"/><path d="M146 468Q142 410 164 392" stroke="#6f6a62" stroke-width="3" fill="none"/>
  ${[405,418,431,444].map((y,i)=>`<path d="M160 ${y}H${206-i*3}" stroke="#4a463f" stroke-width="2" stroke-dasharray="5 2 2 2"/>`).join('')}
  <path d="M30 120l8 4 8-4M70 150l6 3 6-3M300 110l7 3 7-3" stroke="#3a2a2a" stroke-width="2" fill="none"/>`),
forest:()=>SV(`<defs><linearGradient id="fs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc7a8"/><stop offset="1" stop-color="#e5f0d6"/></linearGradient></defs>
  <rect width="360" height="640" fill="url(#fs)"/>${firs(22,300,360,110,170,'#5e7f5a',7)}${firs(16,380,430,180,250,'#3c5a3a',11)}
  <rect y="460" width="360" height="180" fill="#3a4a26"/><path d="M140 640Q170 540 172 460H188Q192 540 230 640Z" fill="#6a5a3a"/>
  ${firs(7,490,560,260,330,'#203a26',13)}
  <path d="M120 0L60 640H100L150 0Z" fill="#fff" opacity=".08"/><path d="M260 0L220 640H250L280 0Z" fill="#fff" opacity=".07"/>`),
dark:()=>SV(`<rect width="360" height="640" fill="#141c1a"/>${firs(22,300,360,110,170,'#22302a',8)}${firs(16,380,430,180,250,'#18241e',12)}
  <rect y="460" width="360" height="180" fill="#121a14"/>${firs(7,490,560,260,330,'#0b120d',14)}
  <rect y="300" width="360" height="260" fill="#cfd8d4" opacity=".18"/><ellipse cx="180" cy="470" rx="260" ry="70" fill="#dfe8e4" opacity=".22"/>`),
night:()=>SV(`<defs><linearGradient id="ns" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070a1e"/><stop offset="1" stop-color="#25204a"/></linearGradient>
  <radialGradient id="fire"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient></defs>
  <rect width="360" height="640" fill="url(#ns)"/>${stars(70,5)}<circle cx="80" cy="110" r="26" fill="#f4eccf"/><circle cx="91" cy="104" r="24" fill="#0d1028"/>
  ${firs(22,320,370,120,180,'#11142a',9)}<rect y="470" width="360" height="170" fill="#0e1020"/>${firs(6,500,560,280,330,'#06070f',21)}
  <circle cx="180" cy="470" r="150" fill="url(#fire)"/>
  <path d="M150 482L210 466M150 466L210 482" stroke="#4a2a14" stroke-width="9" stroke-linecap="round"/>
  <g class="flick"><path d="M162 474Q160 440 180 412Q200 440 198 474Z" fill="#ff8a1f"/><path d="M170 474Q170 450 180 432Q190 450 190 474Z" fill="#ffd34d"/></g>`),
river:()=>SV(`<defs><linearGradient id="rs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ec6ee"/><stop offset="1" stop-color="#e6f4ff"/></linearGradient>
  <linearGradient id="rw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8fbf"/><stop offset="1" stop-color="#2b5f8f"/></linearGradient></defs>
  <rect width="360" height="640" fill="url(#rs)"/><path d="M0 120q20-14 40 0q20-16 40 0z" fill="#fff" opacity=".9"/><path d="M230 90q18-12 36 0q18-14 36 0z" fill="#fff" opacity=".85"/>
  ${firs(26,320,345,50,80,'#4f7a52',4)}<rect y="340" width="360" height="40" fill="#6f9a5a"/>
  <rect y="372" width="360" height="140" fill="url(#rw)"/>
  ${[395,420,448,478].map((y,i)=>`<path d="M${20+i*30} ${y}h40M${190-i*20} ${y+8}h50M${300-i*10} ${y-4}h30" stroke="#cfe6ff" stroke-width="2" opacity=".6"/>`).join('')}
  <path d="M0 500Q180 480 360 505V640H0Z" fill="#e3cf98"/>
  ${[20,40,58,300,318,334].map((x,i)=>`<path d="M${x} 520Q${x+4} 450 ${x+(i%2?10:-6)} 410" stroke="#5a7a32" stroke-width="3" fill="none"/><ellipse cx="${x+(i%2?10:-6)}" cy="420" rx="3" ry="9" fill="#6a4a24"/>`).join('')}`),
izba:()=>SV(`<defs><linearGradient id="is" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1236"/><stop offset=".7" stop-color="#7a3a6a"/><stop offset="1" stop-color="#c0607a"/></linearGradient>
  <radialGradient id="ig"><stop offset="0" stop-color="#ffcc55" stop-opacity=".6"/><stop offset="1" stop-color="#ffcc55" stop-opacity="0"/></radialGradient></defs>
  <rect width="360" height="640" fill="url(#is)"/>${stars(30,8)}<circle cx="290" cy="90" r="22" fill="#f6efd0"/>
  ${firs(24,300,350,120,170,'#1e1530',6)}<rect y="440" width="360" height="200" fill="#2b2a1e"/>
  <path d="M150 360Q132 400 150 425L140 462M150 462l-14 4M150 462l2 10M150 462l14-2" stroke="#d9a13a" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M214 360Q234 400 214 425L224 462M224 462l-14 4M224 462l2 10M224 462l14-2" stroke="#d9a13a" stroke-width="9" stroke-linecap="round" fill="none"/>
  <rect x="112" y="262" width="140" height="102" fill="#7a4f2a"/>
  ${[0,1,2,3,4,5,6,7].map(i=>`<path d="M112 ${274+i*12.5}H252" stroke="#4a2e18" stroke-width="2"/><circle cx="110" cy="${268+i*12.5}" r="6" fill="#9a6a3a" stroke="#4a2e18"/><circle cx="254" cy="${268+i*12.5}" r="6" fill="#9a6a3a" stroke="#4a2e18"/>`).join('')}
  <path d="M96 268L182 196L268 268Z" fill="#4a3a2a"/><path d="M110 262L182 204L254 262" fill="none" stroke="#6a5536" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="182" cy="306" r="60" fill="url(#ig)"/><rect x="164" y="288" width="36" height="36" fill="#ffcc55"/><path d="M182 288V324M164 306H200" stroke="#5a3a1a" stroke-width="3"/>
  <path d="M158 284h48l-6-8h-36z" fill="#eadfc4"/><path d="M158 326h48l-6 8h-36z" fill="#eadfc4"/>

end_good:{bg:'hall',end:1,s:[

const ENDS={
  stone:{t:'Камень не врал',d:'Свернул налево — и потерял себя в тумане.',h:'Камень у распутья пишет правду.'},
  oven:{t:'Печь Бабы-Яги',d:'Не стоило грубить старушке, да ещё и загадки путать.',h:'Нагруби Бабе-Яге и ошибись в загадках.'},
  duck:{t:'Улетела утка',d:'Без друзей и сил Кощееву смерть не добыть.',h:'Пройди путь один, без помощников.'},
  bargain:{t:'Слово Кощеево',d:'С Кощеем не торгуются.',h:'Поверь Кощею на слово.'},
  wedding:{t:'Свадьба на весь мир',d:'Кощей повержен, Василиса спасена. И я там был, мёд-пиво пил.',h:'Одолей Кощея.'},
  wise:{t:'Премудрость',d:'Ты был добр к каждому — и Василиса нашла путь лучше смерти.',h:'Будь добр ко всем, кого встретишь, — даже к Бабе-Яге.'}
};

/* ============ Движок ============ */
const $=s=>document.querySelector(s);
const E={stage:$('#stage'),bgs:$('#bgs'),chars:$('#chars'),box:$('#box'),name:$('#name'),text:$('#text'),more:$('#more'),choices:$('#choices'),top:$('#top')};
const ST={sc:null,steps:[],i:0,f:{},chars:{}};
let typing=null,full='',mode=null,log=[];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let curBg=null;
function setBg(id){
  if(curBg===id)return;curBg=id;
  const d=document.createElement('div');d.className='bg';d.innerHTML=BG[id]();E.bgs.appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('on')));
  const old=[...E.bgs.children].slice(0,-1);setTimeout(()=>old.forEach(o=>o.remove()),900);
}
function showChar(id,p){
  let el=ST.chars[id];const c=CH[id];
  if(!el){el=document.createElement('div');el.className='ch';
    const [, , vw,vh]=c.vb.split(' ').map(Number);
    el.style.height=c.h+'%';el.style.aspectRatio=vw+'/'+vh;
    el.innerHTML=`<svg viewBox="${c.vb}" xmlns="http://www.w3.org/2000/svg"><g class="bob">${c.svg}</g></svg>`;
    if(c.lift)el.style.bottom=c.lift+'%';else if(c.h<30)el.style.bottom='42%';
    E.chars.appendChild(el);ST.chars[id]=el;el.style.left=POS[p]+'%';
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));
  }else el.style.left=POS[p]+'%';
}
function hideChar(id){const el=ST.chars[id];if(!el)return;delete ST.chars[id];el.classList.remove('on');setTimeout(()=>el.remove(),500)}
function clearChars(){Object.keys(ST.chars).forEach(hideChar)}
function fx(k){
  if(k==='shake'){E.stage.classList.remove('shake');void E.stage.offsetWidth;E.stage.classList.add('shake');hap('heavy')}
  if(k==='flash'){const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
}
function save(){LS.set('skazka-save',{sc:ST.sc,f:ST.f})}
function startScene(id){
  const sc=SC[id];ST.sc=id;ST.steps=sc.s.slice();ST.i=0;
  if(!sc.end)save();
  clearChars();if(sc.bg)setBg(sc.bg);run();
}
function splice(a){ST.steps=a.concat(ST.steps.slice(ST.i));ST.i=0}
function run(){
  while(ST.i<ST.steps.length){
    const s=ST.steps[ST.i++],k=s[0];
    switch(k){
      case 'bg':setBg(s[1]);break;
      case 'show':showChar(s[1],s[2]||'c');break;
      case 'hide':hideChar(s[1]);break;
      case 'clear':clearChars();break;
      case 'set':Object.assign(ST.f,s[1]);break;
      case 'add':ST.f[s[1]]=(ST.f[s[1]]||0)+s[2];break;
      case 'if':splice(s[1](ST.f)?s[2]:(s[3]||[]));break;
      case 'fx':fx(s[1]);break;
      case 'go':startScene(s[1]);return;
      case 'ch':choose(s[1]);return;
      case 'end':ending(s[1]);return;
      default:say(k,s[1]);return;
    }
  }
}
function say(who,text){
  mode='text';E.box.classList.remove('hidden');E.choices.innerHTML='';
  const nar=who==='n';E.name.classList.toggle('hid',nar);E.name.textContent=nar?'':NAMES[who];E.text.classList.toggle('nar',nar);
  for(const id in ST.chars)ST.chars[id].classList.toggle('dim',!nar&&id!==who&&!!ST.chars[who]);
  log.push([who,text]);if(log.length>200)log.shift();
  full=text;let n=0;E.more.classList.remove('on');clearInterval(typing);E.text.textContent='';
  typing=setInterval(()=>{n+=2;E.text.textContent=full.slice(0,n);if(n>=full.length)done()},28);
}
function done(){clearInterval(typing);typing=null;E.text.textContent=full;E.more.classList.add('on')}
function advance(){if(mode!=='text'||overlayOpen())return;if(typing){done();return}run()}
function choose(opts){
  mode='choice';E.more.classList.remove('on');
  for(const id in ST.chars)ST.chars[id].classList.remove('dim');
  E.choices.innerHTML='';
  opts.filter(o=>!o.if||o.if(ST.f)).forEach((o,i)=>{
    const b=document.createElement('button');b.className='btn';b.textContent=o.t;b.style.animationDelay=i*.07+'s';
    b.onclick=e=>{e.stopPropagation();if(mode!=='choice')return;hap('light');E.choices.innerHTML='';
      log.push(['ivan','▸ '+o.t]);
      if(o.set)Object.assign(ST.f,o.set);
      if(o.add)for(const k in o.add)ST.f[k]=(ST.f[k]||0)+o.add[k];
      splice((o.s||[]).concat(o.go?[['go',o.go]]:[]));mode=null;run()};
    E.choices.appendChild(b)});
}
function ending(id){
  mode='end';const got=LS.get('skazka-ends',[]);if(!got.includes(id)){got.push(id);LS.set('skazka-ends',got)}
  setTimeout(()=>{$('#eTitle').textContent='«'+ENDS[id].t+'»';$('#eDesc').textContent=ENDS[id].d;
    $('#eCount').textContent='Открыто концовок: '+got.length+' из '+Object.keys(ENDS).length;openOv('#endv')},400);
}
/* ============ Меню и экраны ============ */
const overlayOpen=()=>[...document.querySelectorAll('.ov')].some(o=>!o.classList.contains('hid'));
function openOv(s){$(s).classList.remove('hid')}
function close(s){$(s).classList.add('hid')}
function closeAll(){document.querySelectorAll('.ov').forEach(o=>o.classList.add('hid'))}
function begin(f,sc){closeAll();log=[];E.top.style.display='flex';ST.f=f;startScene(sc)}
function newGame(){begin({sila:1},'start')}
function loadGame(){const s=LS.get('skazka-save',null);if(s&&SC[s.sc])begin(s.f,s.sc);else newGame()}
function toTitle(){closeAll();clearInterval(typing);mode=null;E.box.classList.add('hidden');E.choices.innerHTML='';E.top.style.display='none';clearChars();setBg('cross');refreshTitle();openOv('#title')}
function refreshTitle(){$('#tCont').style.display=LS.get('skazka-save',null)?'':'none';const n=LS.get('skazka-ends',[]).length;$('#tEnds').textContent='Концовки '+n+'/'+Object.keys(ENDS).length}
$('#tNew').onclick=newGame;$('#tCont').onclick=loadGame;
$('#tEnds').onclick=()=>{const got=LS.get('skazka-ends',[]);
  $('#endList').innerHTML=Object.entries(ENDS).map(([k,e])=>got.includes(k)?`<div class="end-it"><b>${e.t}</b>${e.d}</div>`:`<div class="end-it lock"><b>???</b>Подсказка: ${e.h}</div>`).join('');openOv('#ends')};
$('#bMenu').onclick=e=>{e.stopPropagation();openOv('#menu')};
$('#bLog').onclick=e=>{e.stopPropagation();
  $('#logList').innerHTML=log.map(([w,t])=>w==='n'?`<div class="log-it"><i>${t}</i></div>`:`<div class="log-it"><b>${NAMES[w]}:</b> ${t}</div>`).join('')||'<p>Пока пусто.</p>';
  openOv('#logv');const l=$('#logList');l.scrollTop=l.scrollHeight};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>{e.stopPropagation();b.closest('.ov').classList.add('hid')});
$('#mRe').onclick=$('#eRe').onclick=loadGame;
$('#mTitle').onclick=$('#eTitleBtn').onclick=toTitle;
E.stage.addEventListener('click',e=>{if(e.target.closest('button'))return;advance()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();advance()}
  if(e.code==='Escape'){if(overlayOpen()&&$('#title').classList.contains('hid')&&$('#endv').classList.contains('hid'))closeAll();else if(!overlayOpen()&&mode)openOv('#menu')}});
setBg('cross');refreshTitle();
/* отладка: ?scene=oak&f={"wolf":1} */
(()=>{const q=new URLSearchParams(location.search);if(q.get('scene')&&SC[q.get('scene')])begin(Object.assign({sila:1},JSON.parse(q.get('f')||'{}')),q.get('scene'))})();
</script></body></html>
